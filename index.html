<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Al Waha Quarter: an interactive interdisciplinary case activity for M.Sc. Data Science students.">
<title>Al Waha Quarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style id="css">
:root{
  --bg:#EDF2F2; --surface:#FFFFFF; --surface-2:#E2EAEA; --ink:#14313A; --ink-2:#4B6269; --line:#C5D3D4;
  --accent:#0E6B72; --accent-ink:#FFFFFF; --accent-soft:#D3E8E8;
  --h0:#F7EEDB; --h1:#F5D29B; --h2:#EFA565; --h3:#DC6C45; --h4:#B23A3A; --na:#D5DCDC;
  --park:#CFE2CB; --road:#BAC6C7;
  --good:#2E7D4F; --warn:#B7791F; --bad:#B23A3A;
  --r1:#B23A3A; --r2:#D98545; --r3:#C9B458; --r4:#6BA36F; --r5:#2E7D4F;
  --shadow:0 1px 2px rgba(20,49,58,.08),0 4px 16px rgba(20,49,58,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1C20; --surface:#16272C; --surface-2:#1D3238; --ink:#E4EEEE; --ink-2:#9DB3B6; --line:#2C454B;
  --accent:#4FB3B5; --accent-ink:#0F1C20; --accent-soft:#1E3F43;
  --h0:#3A3526; --h1:#6B5A2E; --h2:#9A6433; --h3:#B9563A; --h4:#D8584F; --na:#2A3A3E;
  --park:#1F3B2A; --road:#2A3B40;
  --good:#5FBF84; --warn:#E0A847; --bad:#E8726A;
  --r1:#D8584F; --r2:#D98545; --r3:#C9B458; --r4:#7DBA82; --r5:#5FBF84;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1C20; --surface:#16272C; --surface-2:#1D3238; --ink:#E4EEEE; --ink-2:#9DB3B6; --line:#2C454B;
  --accent:#4FB3B5; --accent-ink:#0F1C20; --accent-soft:#1E3F43;
  --h0:#3A3526; --h1:#6B5A2E; --h2:#9A6433; --h3:#B9563A; --h4:#D8584F; --na:#2A3A3E;
  --park:#1F3B2A; --road:#2A3B40;
  --good:#5FBF84; --warn:#E0A847; --bad:#E8726A;
  --r1:#D8584F; --r2:#D98545; --r3:#C9B458; --r4:#7DBA82; --r5:#5FBF84;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5;padding:0 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(20px,3.4vw,26px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:12px 18px;font-weight:700;min-height:48px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.who{font-size:14px;color:var(--ink-2)}
.steps{display:flex;gap:6px;margin:4px 0 20px;flex-wrap:wrap}
.steps span{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:700}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.steps span.done{background:var(--accent-soft);color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
label.f span.hint{font-weight:400;color:var(--ink-2);font-size:14px}
input[type=text],textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;font-size:16px}
textarea{min-height:96px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

/* join */
.join{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.intro .lede{font-size:18px;margin-top:10px;max-width:60ch}
.fine{font-size:13px;color:var(--ink-2);margin-top:14px;max-width:60ch}

/* explore */
.explore{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.mapcard{padding:14px}
.metricbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .star{color:var(--accent)}
.chip[aria-pressed="true"] .star{color:var(--bg)}
svg.map{width:100%;height:auto;display:block;border-radius:10px;background:var(--surface-2)}
svg.map .zone{cursor:pointer;stroke:var(--surface);stroke-width:2.5;transition:fill .35s}
svg.map .zone.sel{stroke:var(--ink);stroke-width:3.5}
svg.map text{fill:var(--ink);font-family:"Bricolage Grotesque",sans-serif;pointer-events:none}
svg.map .val{font-family:"JetBrains Mono",monospace;font-size:12px}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px}
.zonecard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.zonecard dt{color:var(--ink-2)}
.zonecard dd{margin:0;font-weight:700}
.zonecard dd.hl{background:var(--accent-soft);border-radius:6px;padding:0 6px;margin-left:-6px}
.notes{margin:0;padding-left:18px;font-size:15px}
.notes li{margin-bottom:6px}
.lensbox{border-left:4px solid var(--accent);padding:12px 14px;background:var(--accent-soft);border-radius:0 10px 10px 0}
.lensbox ul{margin:8px 0 0;padding-left:18px;font-size:15px}

/* intervene */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.meter{padding:14px}
.meter .big{font-size:26px;font-weight:500;margin-top:2px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar i.over{background:var(--bad)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.meter.lens{border:2px solid var(--accent)}
.rating{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.locked{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.locked span{font-size:13px;padding:5px 10px;border:1.5px dashed var(--line);border-radius:999px;color:var(--ink-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.icard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;position:relative}
.icard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.icard .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.icard .cost{font-family:"JetBrains Mono",monospace;font-size:14px;white-space:nowrap}
.icard .desc{font-size:15px}
.icard .facts{display:flex;gap:6px;flex-wrap:wrap}
.icard .facts span{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:2px 8px}
.icard .lensline{font-size:14px;border-top:1px solid var(--line);padding-top:8px;color:var(--ink)}
.icard .lensline b{color:var(--accent)}
.icard .tick-mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700}
.icard[aria-pressed="true"] .tick-mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icard.cant{opacity:.55}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin-top:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(20,49,58,.14)}

/* report */
.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.quote{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(20px,3.2vw,26px);line-height:1.25;font-weight:500}
.plist{display:flex;gap:6px;flex-wrap:wrap}
.plist span{background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:14px}
table.mx{border-collapse:collapse;width:100%;font-size:14px}
table.mx th,table.mx td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.mx th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
table.mx td.own{outline:2px solid var(--ink);outline-offset:-3px;border-radius:6px}
.scroll{overflow-x:auto}

/* board */
.boardhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.gcard .gname{display:flex;justify-content:space-between;gap:8px;align-items:center}
.gcard .lenstag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.gcard .lenstag.hidden{background:var(--surface-2);color:var(--ink-2)}
.gcard .state{font-size:13px;color:var(--ink-2)}
.gcard.gone{opacity:.7}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--ink-2)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.switch{width:52px;height:30px;border-radius:15px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:25px;background:var(--accent-ink)}
.banner{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:14px;margin-bottom:14px}
footer{margin-top:36px;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.testbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.testbar .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.testgrid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:22px;align-items:start}
.phone{border:10px solid var(--ink);border-radius:30px;background:var(--bg);padding:16px 14px;max-height:calc(100vh - 140px);overflow-y:auto}
.phone .explore,.phone .join,.phone .report,.phone .meters{grid-template-columns:1fr}
.phone h1{font-size:24px}
.phone .panel{padding:14px}
.phone .sticky{bottom:0}
.panehead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:8px}
@media (max-width:900px){.testgrid{grid-template-columns:1fr}.phone{max-height:none}}
@media (max-width:820px){
  .join,.explore,.report{grid-template-columns:1fr}
  .meters{grid-template-columns:1fr}
  .meter .big{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.jointeams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.jointeams label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-weight:700;cursor:pointer;background:var(--bg);min-height:48px}
.jointeams input{accent-color:var(--accent);width:18px;height:18px}
.jointeams label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles label{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--bg)}
.roles label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles b{font-size:15px}.roles span{font-size:13px;color:var(--ink-2)}
.timer{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:700}
.timer .num{font-size:22px}
.timer.over{background:var(--bad);color:#fff}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:12px;border:2px dashed var(--accent);border-radius:12px;padding:12px 14px}
.codebox .num{font-size:26px;letter-spacing:.06em}
.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.trow .n{font-weight:700;color:var(--ink-2);text-align:center}
select{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px;width:100%;font-size:16px}
input[type=number]{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px;width:100%;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.stepper .num{font-size:22px;min-width:2ch;text-align:center}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center}
.qrbox svg{width:100%;max-width:360px;height:auto}
.qrbig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.qrbig .qrbox svg{max-width:520px}
.url{font-family:"JetBrains Mono",monospace;font-size:13px;word-break:break-all;color:var(--ink-2)}
.status{font-size:14px;min-height:1.4em}
.status.ok{color:var(--good)}.status.bad{color:var(--bad)}
.addcode{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.addcode input{max-width:160px}
.addcode .grow{flex:1;min-width:200px;max-width:none}
@media (max-width:820px){.setup,.qrbig{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.roles{grid-template-columns:1fr}}
</style>


</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 24h18M11 24v-7h4v7M17 24V11h5v13" stroke="var(--accent-ink)" stroke-width="2" fill="none"/><circle cx="24" cy="9" r="3" fill="var(--h2)"/></svg>
      <div><b>Al Waha Quarter</b><div class="who" id="who">Interdisciplinary Elective · Session 1</div></div>
    </div>
    <nav class="steps" id="steps" aria-label="Progress"></nav>
  </header>
  <div id="timerbar"></div>
  <main id="app" aria-live="polite"></main>
  <footer>
    <span>Fictional neighbourhood and invented figures, for teaching only.</span>
    <span id="footlinks"></span>
  </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="application/json" id="cfg">{"v":1,"teams":[{"name":"Oasis","lens":"planner"},{"name":"Dune","lens":"economist"},{"name":"Falaj","lens":"lawyer"},{"name":"Sidr","lens":"resident"},{"name":"Mirage","lens":"engineer"}],"budget":10,"target":15,"timerMin":20,"endsAt":null,"shareUrl":""}</script>
<script id="main">
(function(){
"use strict";
// ---------------- snapshot of the page (used when the admin republishes the setup) ----------------
const SNAP = {
  wrap: document.querySelector(".wrap").outerHTML,
  links: [...document.querySelectorAll('link[href*="fonts.g"]')].map(l=>l.outerHTML).join(""),
  css: document.getElementById("css").outerHTML,
  libs: [...document.querySelectorAll("script[src]")].filter(s=>/qrcode/.test(s.src)).map(s=>`<script src="${s.src}"><\/script>`).join(""),
  main: document.getElementById("main").textContent
};

// ---------------- config ----------------
const DEFAULT_CFG = {v:1,teams:[{name:"Oasis",lens:"planner"},{name:"Dune",lens:"economist"},{name:"Falaj",lens:"lawyer"},{name:"Sidr",lens:"resident"},{name:"Mirage",lens:"engineer"}],budget:10,target:15,timerMin:20,endsAt:null,shareUrl:"https://claude.ai/artifact/Wnc2HBG5jXFakJXVVWe3V1"};
// STATIC = running as a plain website (e.g. GitHub Pages) with no claude.ai runtime behind it.
const STATIC = !(window.claude && typeof window.claude.use==="function");
const enc = o=>{const b=btoa(unescape(encodeURIComponent(JSON.stringify(o))));return b.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const dec = s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
const valid = c=>c&&Array.isArray(c.teams)&&c.teams.length>=1&&c.teams.every(t=>t&&typeof t.name==="string"&&LENSES[t.lens]);
function readCfg(){
  const base = ()=>{ try{ const c=JSON.parse(document.getElementById("cfg").textContent); if(valid(c)) return Object.assign({},DEFAULT_CFG,c); }catch(e){} return JSON.parse(JSON.stringify(DEFAULT_CFG)); };
  let c = base();
  if(STATIC){
    // 1) settings carried in the QR link (?s=...), 2) the facilitator's own saved settings on this computer
    try{ const q=new URLSearchParams(location.search).get("s"); if(q){ const u=dec(q); if(valid(u)) return Object.assign({},c,u,{fromLink:true}); } }catch(e){}
    try{ const l=JSON.parse(localStorage.getItem("alwaha.cfg")||"null"); if(valid(l)) c=Object.assign({},c,l); }catch(e){}
    if(!c.shareUrl || /claude\.ai/.test(c.shareUrl)) c.shareUrl = location.origin + location.pathname;
  }
  return c;
}
// the link students open: on a plain website it carries the setup; inside claude.ai the page itself carries it
function joinUrl(cfg){
  if(!STATIC) return cfg.shareUrl;
  const {teams,budget,target,timerMin,endsAt}=cfg;
  return (cfg.shareUrl||location.origin+location.pathname).split("?")[0].split("#")[0] + "?s=" + enc({teams,budget,target,timerMin,endsAt});
}

// ---------------- data ----------------
const TOTAL = 80880; // kWh/day, all zones, Jul-Aug
const tgtKwh = ()=>Math.round(TOTAL*CFG.target/100);

const ZONES = {
  A:{name:"Detached villas", units:"120 villas", residents:540, perUnit:"142 kWh per villa", daily:17040, perPerson:31.6, perM2:0.34, cooling:71, solar:"38% of roofs", payer:"Owners", control:"Each household", complaints:4, peak:"14:00–17:00"},
  B:{name:"Townhouses", units:"260 townhouses", residents:1040, perUnit:"68 kWh per townhouse", daily:17680, perPerson:17.0, perM2:0.31, cooling:68, solar:"12% of roofs", payer:"Mixed, 55% renters", control:"Each household", complaints:11, peak:"14:00–17:00"},
  C:{name:"Mid-rise apartments", units:"640 apartments", residents:1790, perUnit:"39 kWh per apartment", daily:24960, perPerson:13.9, perM2:0.36, cooling:64, solar:"Shared roof, none", payer:"Renters, fixed fee via landlord", control:"Tenant sets it, landlord pays in bulk", complaints:37, peak:"14:00–17:00"},

// ---------------- scoring ----------------
function totals(ids){
  const t={cost:0,kwh:0,peak:0,comfort:0,fair:0,legal:0,long:0};
  ids.forEach(id=>{const i=IBY[id]; if(!i) return; for(const k in t) t[k]+=i[k];});
  t.cost=Math.round(t.cost*10)/10;
  return t;
}
const pctSaved = t=>Math.max(0,t.kwh)/TOTAL*100;
const RLABEL=["Poor","Weak","Fair","Good","Strong"];
function band(v,cuts){let r=0;for(const c of cuts){if(v>=c)r++;}return r;}
function measures(ids){
  const t=totals(ids), n=ids.length;
  const aedPer = t.kwh>0 ? t.cost*1e6/t.kwh : Infinity;
  return {
    planner:{value:(t.long>0?"+":"")+t.long, note:"long-term score", r: n? band(t.long,[1,2,4,6]) : 0},
    economist:{value: t.kwh>0? "AED "+Math.round(aedPer).toLocaleString("en-US"):"no saving", note:"per kWh/day saved", r: t.kwh>0 ? 4-band(aedPer,[500,700,1000,1500]) : 0},
    lawyer:{value: t.legal===0?"No flags":Math.abs(t.legal)+" risk flag"+(Math.abs(t.legal)>1?"s":""), note:"consent, contracts, approvals", r: n? band(t.legal,[-4,-2,-1,0]) : 0},
    resident:{value:(t.comfort+t.fair>0?"+":"")+(t.comfort+t.fair), note:"comfort + fairness score", r: n? band(t.comfort+t.fair,[-1,1,3,6]) : 0},
    engineer:{value:t.peak+"%", note:"of the afternoon peak", r: band(t.peak,[5,10,18,25])}
  };
}
const rcolor=r=>"var(--r"+(r+1)+")";
const rpill=r=>`<span class="rating" style="background:${rcolor(r)}">${RLABEL[r]}</span>`;

// board codes: team number + plan bitmask, e.g. "3-7F"
function planCode(teamIdx, ids){let m=0;INTS.forEach((it,i)=>{if(ids.includes(it.id))m|=1<<i;});return (teamIdx+1)+"-"+m.toString(36).toUpperCase();}
function parseCode(code){
  const mm=String(code||"").trim().toUpperCase().match(/^(\d{1,2})\s*-?\s*([0-9A-Z]{1,3})$/); if(!mm) return null;
  const t=+mm[1]-1, m=parseInt(mm[2],36); if(!(t>=0&&t<CFG.teams.length)||isNaN(m)||m>=1<<INTS.length) return null;
  return {team:t, plan:INTS.filter((_,i)=>m&(1<<i)).map(i=>i.id)};
}

const seen=new Map(); // key -> {p:{team,name,problem,missing,plan,submitted}, online, src}
let manual={}; try{manual=JSON.parse(localStorage.getItem("alwaha.board")||"{}")||{};}catch(e){manual={};}
const saveManual=()=>{try{localStorage.setItem("alwaha.board",JSON.stringify(manual));}catch(e){}};
let demo=false, confirmReset=false;
const DEMO=[
  {problem:"Zone D is built too dense and too hot; behaviour won't fix the buildings.",missing:"Building age and fabric",plan:["retrofit","shade"],submitted:true},
  {problem:"Nobody who can save energy has a price reason to: fixed fees in C, employer pays in D.",missing:"What tenants actually pay",plan:["tou","lease","nudge","dr"],submitted:true},
  {problem:"The operator is about to use home-level data with no clear consent or legal basis.",missing:"Current consent terms",plan:["data","lease","shade"],submitted:true},
  {problem:"The people with the worst heat and the least say are in Zone D, and nobody asked them.",missing:"Indoor temperatures in Zone D",plan:["retrofit","control","data"],submitted:true},
  {problem:"Everyone's AC peaks at the same time in the afternoon, and the grid has no headroom.",missing:"Hour-by-hour load by building",plan:["dr","tou","solar","nudge"],submitted:true}
];
function teamRows(){
  // one row per configured team; live answers win over typed codes
  return CFG.teams.map((t,i)=>{
    let p=null, src=null, online=false;
    if(demo){ const d=DEMO[i%DEMO.length]; p=Object.assign({team:i},d); src="demo"; online=true; }
    else {
      for(const v of seen.values()) if(v.p.team===i){ p=v.p; src="live"; online=v.online; }
      if(!p && manual[i]){ p=Object.assign({team:i,submitted:true},manual[i]); src="code"; }
    }
    return {i,t,p,src,online};
  });
}
function renderBoard(){
  const rows=teamRows(), done=rows.filter(r=>r.p);
  const root = view==="test" ? document.getElementById("tBoard") : app;
  if(!root) return;
  root.innerHTML=`
  <section>
    <div class="boardhead">

    <div class="bgrid">${rows.map(r=>{const p=r.p;const L=LENSES[r.t.lens];
      if(!p) return `<article class="gcard gone"><div class="gname"><h3>${esc(r.t.name)}</h3>${revealed?`<span class="lenstag">${esc(L.name)}</span>`:`<span class="lenstag hidden">Lens hidden</span>`}</div><p class="state">Waiting for this team</p></article>`;

        ${r.src==="code"?`<button type="button" class="btn quiet" data-del="${r.i}" style="min-height:36px;padding:6px 12px;align-self:start">Remove</button>`:""}
      </article>`;}).join("")}</div>

        :`<button class="btn ghost" type="button" id="reset">Clear board</button>`}

  });
  root.querySelector("#copy").onclick=()=>{
    const txt=teamRows().filter(r=>r.p).map(r=>{const p=r.p,t=totals(p.plan||[]);return `${r.t.name} (${LENSES[r.t.lens].name})\nProblem: ${p.problem||""}\nMissing data: ${p.missing||""}\nPlan: ${(p.plan||[]).map(id=>IBY[id]?.title).join("; ")} | AED ${t.cost.toFixed(1)}m | saves ${pctSaved(t).toFixed(1)}%`;}).join("\n\n");
    const msg=root.querySelector("#copymsg");
    try{navigator.clipboard.writeText(txt).then(()=>msg.textContent="Copied.",()=>msg.textContent="Copy blocked by this browser.");}catch(e){msg.textContent="Copy blocked by this browser.";}
  };
  const rs=root.querySelector("#reset"); if(rs) rs.onclick=()=>{confirmReset=true;renderBoard();};
  const ry=root.querySelector("#resetyes"); if(ry) ry.onclick=()=>{confirmReset=false;revealed=false;
    if(view==="test"){TEST.states=CFG.teams.map((t,i)=>Object.assign(fresh(),{team:i,scribe:true}));TEST.slot=0;S=TEST.states[0];render();return;}
    manual={};saveManual();seen.clear();renderBoard();};
  const rn=root.querySelector("#resetno"); if(rn) rn.onclick=()=>{confirmReset=false;renderBoard();};
}

        <h3>Class QR code</h3>
        <div class="qrbox">${svg||'<p style="color:#14313A">QR code unavailable here.</p>'}</div>
        <label class="f" for="su">${STATIC?"Web address of this page":"Link the QR opens"} <span class="hint">${STATIC?"Filled in automatically; the QR adds your setup to it":"Use the page's public share link"}</span>
          <input type="text" id="su" value="${esc(draft.shareUrl)}" spellcheck="false"></label>
        <button class="btn ghost" type="button" id="toqr">Project the QR full screen</button>
      </div>
    </div>
  </section>`;
  const $=id=>document.getElementById(id);
  $("tminus").onclick=()=>{ if(draft.teams.length>2){draft.teams.pop();renderSetup();} };
  $("tplus").onclick=()=>{ if(draft.teams.length<8){ const n=draft.teams.length; draft.teams.push({name:"Team "+(n+1), lens:LK[n%LK.length]}); renderSetup(); } };
  app.querySelectorAll("[data-tn]").forEach(inp=>inp.oninput=()=>{draft.teams[+inp.dataset.tn].name=inp.value.slice(0,24);refreshSave();});
  app.querySelectorAll("[data-tl]").forEach(sel=>sel.onchange=()=>{draft.teams[+sel.dataset.tl].lens=sel.value;renderSetup();});
  const num=(id,key,lo,hi)=>{$(id).oninput=()=>{const v=parseFloat($(id).value); if(!isNaN(v)) draft[key]=Math.min(hi,Math.max(lo,v)); refreshSave();};};
  num("sb","budget",1,30); num("st","target",5,40); num("sm","timerMin",1,90);
  $("su").oninput=()=>{draft.shareUrl=$("su").value.trim();refreshSave();};
  $("su").onchange=()=>renderSetup();
  $("savecfg").onclick=()=>{ if(draft.teams.some(t=>!t.name.trim())){setupMsg={text:"Every team needs a name.",cls:"bad"};renderSetup();return;} saveCfg(Object.assign({},draft,{teams:draft.teams.map(t=>({name:t.name.trim(),lens:t.lens}))})); };
  const u=$("undo"); if(u) u.onclick=()=>{draft=null;setupMsg={text:"",cls:""};renderSetup();};
  $("tstart").onclick=()=>saveCfg(Object.assign({},CFG,{timerMin:draft.timerMin,endsAt:Date.now()+draft.timerMin*60000}),"Timer started.");
  const ts=$("tstop"); if(ts) ts.onclick=()=>saveCfg(Object.assign({},CFG,{endsAt:null}),"Timer cleared.");
  $("toqr").onclick=()=>switchView("qr");
}
function refreshSave(){
  const b=document.getElementById("savecfg"); if(!b) return;
  const dirty=JSON.stringify(draft)!==JSON.stringify(CFG);
  b.disabled=!dirty||publishing; b.textContent=dirty?"Save setup":"Setup saved";
}
function buildDoc(cfg){
  const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
  const json=JSON.stringify(cfg).replace(/</g,"\\u003c");
  const main=SNAP.main.replace(/<\/script/gi,"<\\/script");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +'<title>Al Waha Quarter</title>'+SNAP.links+SNAP.css+SNAP.wrap+SNAP.libs
    +'<script type="application/json" id="cfg">'+json+'<\/script>'
    +'<script id="main">'+main+'<\/script></body></html>';
}
async function saveCfg(next, okText){
  publishing=true; setupMsg={text:"Saving…",cls:""}; renderSetup();
  try{
    if(STATIC){
      const keep=Object.assign({},next); delete keep.fromLink;
      try{localStorage.setItem("alwaha.cfg",JSON.stringify(keep));}catch(e){}
      CFG=keep; draft=null; publishing=false; setupMsg={text:(okText||"Saved.")+" The class QR code now carries this setup. Show it to students.",cls:"ok"}; render(); return;
    }
    if(artifactNs===undefined) artifactNs = window.claude?.use ? await window.claude.use("artifact") : null;
    if(!artifactNs){ publishing=false; CFG=next; draft=null; setupMsg={text:"Applied on this screen only. Open the page on claude.ai as its owner to save it for students.",cls:"bad"}; render(); return; }
    await artifactNs.publish(buildDoc(next));
    CFG=next; draft=null; publishing=false; setupMsg={text:(okText||"Saved.")+" Open phones will reload with the new setup.",cls:"ok"}; render();
  }catch(e){
    publishing=false;
    const code=e&&e.code;
    setupMsg={text: code==="conflict"?"Someone saved at the same moment. The page will reload; check the setup and save again.": code==="not_writer"||code==="not_granted"?"Only the page's owner or an editor can save the setup.":"Couldn't save the setup. Try again in a moment.",cls:"bad"};
    renderSetup();
  }
}

// ---------------- live room (signed-in viewers only) ----------------
let pubTimer=null;
function publishSoon(){clearTimeout(pubTimer);pubTimer=setTimeout(publish,400);}
function publish(){
  if(view==="test"){ syncTest(); return; }
  if(!room) return;
  let p;
  if(view!=="student") p={role:"board"};
  else if(S.team!=null && S.scribe && S.stage!=="join") p={role:"group", team:S.team, name:(S.name||"").slice(0,40), problem:(S.problem||"").slice(0,280), missing:(S.missing||"").slice(0,160), plan:S.plan.slice(0,12), submitted:!!S.submitted};
  else p={role:"viewer"};
  room.presence(p).catch(()=>{});
}
function broadcastReveal(){ if(room&&canEdit) room.emit("reveal",{on:revealed}).catch(()=>{}); }
function ingest(peers){
  const now=new Set();
  peers.forEach(pr=>{
    const pp=pr.presence||{};
    if(pp.role==="group" && Number.isInteger(pp.team) && CFG.teams[pp.team]){
      now.add(pr.peer);
      const plan=Array.isArray(pp.plan)?pp.plan.filter(id=>IBY[id]).slice(0,12):[];
      seen.set(pr.peer,{p:{team:pp.team,name:String(pp.name||"").slice(0,40),problem:String(pp.problem||"").slice(0,280),missing:String(pp.missing||"").slice(0,160),plan,submitted:!!pp.submitted},online:true,src:"live"});
    }
  });
  for(const [k,v] of seen) if(!now.has(k)) v.online=false;
}
(async function connect(){
  try{ const u = window.claude?.use ? await window.claude.use("user") : null; canEdit = !!(u && (u.canEdit?.() || u.isOwner?.())); }catch(e){}
  footer();
  try{ room = window.claude?.use ? await window.claude.use("room") : null; }catch(e){ room=null; }
  if(!room) return;
  room.onConnection(c=>{roomOK=c; if(c) publish();},()=>{roomOK=false;room=null;});
  room.onPeers(ch=>{
    if(view==="test") return;
    ingest(ch.peers);
    if(view==="board"){ renderBoard(); if(revealed && ch.joined.length) broadcastReveal(); }
  });
  room.on("reveal",msg=>{ if(msg.sameTab||view!=="student") return; revealed=!!(msg.data&&msg.data.on); if(S.stage==="report") renderReport(); });
  publish();
})();

window.addEventListener("hashchange",()=>{const h=location.hash.replace("#",""); const to=["board","test","setup","qr"].includes(h)?h:"student"; if(to!==view) switchView(to);});
render();
})();
</script>
